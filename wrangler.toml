name = "eplate-app"
main = "src/worker.js"
compatibility_date = "2026-05-04"

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "eplate-prod"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
APP_ENV = "preview"
APP_BASE_URL = "https://order.eplate.my"
ADMIN_BASE_URL = "https://admin.eplate.my"
PRODUCT_PRICE_CENTS = "15000"
SESSION_COOKIE_NAME = "eplate_session"
COOKIE_DOMAIN = ".eplate.my"
WHATSAPP_VERIFY_TOKEN = "replace-with-random-token"
MOCK_PROVIDERS = "true"
FILE_STORAGE = "mock"
